paths:
  dataset_dir: data
  artifact_dir: artifacts
  report_dir: reports

sampling:
  train_queries: 5000
  validation_queries: 1000
  test_queries: 1000
  random_seed: 42

tfidf:
  word_ngram_range: [1, 2]
  word_max_features: 30000
  char_ngram_range: [3, 5]
  char_max_features: 40000
  min_df: 2
  lexical_word_weights: [0.25, 0.5, 0.75]

lightgbm:
  objective: lambdarank
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 30
  subsample: 0.9
  colsample_bytree: 0.9
  reg_lambda: 1.0
  random_state: 42
  n_jobs: -1
  verbosity: -1
  label_gain: [0.0, 0.01, 0.1, 1.0]
  early_stopping_rounds: 50


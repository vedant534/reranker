paths:
  dataset_dir: data
  artifact_dir: artifacts
  report_dir: reports

sampling:
  train_queries: 5000
  validation_queries: 1000
  legacy_test_queries: 1000
  random_seed: 42

evaluation:
  bootstrap_seed: 2029
  bootstrap_replicates: 2000
  inference_threads: 1

tfidf:
  word_ngram_range: [1, 2]
  word_max_features: 30000
  char_ngram_range: [3, 5]
  char_max_features: 40000
  min_df: 2
  lexical_word_weights: [0.25, 0.5, 0.75]

lightgbm:
  objective: lambdarank
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 30
  colsample_bytree: 0.9
  reg_lambda: 1.0
  random_state: 42
  n_jobs: -1
  verbosity: -1
  early_stopping_rounds: 50

ranker_candidates:
  - name: tfidf_2_trunc13
    feature_set: tfidf_2
    truncation_level: 13
  - name: all_13_trunc13
    feature_set: all_13
    truncation_level: 13
  - name: all_13_trunc30
    feature_set: all_13
    truncation_level: 30
